name: CapLauncher Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project
        run: unzip -q -o "$(ls CapLauncher*.zip | head -1)" -d project

      - name: Get submodules
        working-directory: project
        run: |
          rm -rf glfw mojoexec sdl
          git clone https://github.com/MojoLauncher/glfw glfw
          git -C glfw checkout 7900e19
          git clone https://github.com/MojoLauncher/mojoexec mojoexec
          git -C mojoexec checkout 5a60f9e
          git clone https://github.com/MojoLauncher/MojoSDL sdl
          git -C sdl checkout cd7eddd

      - name: Get LTW
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          repo: MojoLauncher/LTW
          workflow: android.yml
          workflow_conclusion: success
          name: output-aar
          path: project/app_mojo/libs

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK
        working-directory: project
        run: |
          gradle :app_mojo:assembleFullDebug
          mkdir out
          mv app_mojo/build/outputs/apk/full/debug/app_mojo-full-debug.apk out/CapLauncher.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CapLauncher-APK
          path: project/out/CapLauncher.apk
